name: Deploy MENA Pages From Verified Artifact

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mena-pages-artifact-final
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Download verified MENA Pages artifact
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: ./site
          repository: Akremhu/worldmonitor
          run-id: 36706075581
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate artifact
        run: |
          set -euo pipefail
          test -s ./site/index.html
          test -d ./site/assets
          grep -q 'MENA Monitor' ./site/index.html
          find ./site/assets -type f | grep -Eq '\\.(js|css)$'

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed site
        env:
          PAGE_URL: https://akremhu.github.io/worldmonitor/
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors "$PAGE_URL" -o /tmp/index.html
          test -s /tmp/index.html
          grep -q 'MENA Monitor' /tmp/index.html
          python3 - <<'PY'
          import os, re, subprocess
          from urllib.parse import urljoin
          page_url = os.environ["PAGE_URL"]
          html = open("/tmp/index.html", encoding="utf-8").read()
          refs = re.findall(r'(?:src|href)="([^"]+\\.(?:js|css)(?:\\?[^"]*)?)"', html)
          assets = sorted(set(urljoin(page_url, u) for u in refs if not u.startswith(("data:", "blob:", "http://", "https://"))))
          if not assets:
              raise SystemExit("No local JS/CSS assets found")
          for asset in assets:
              subprocess.run(["curl","--fail","--silent","--show-error","--location","--retry","5","--retry-delay","2","--retry-all-errors",asset,"-o","/dev/null"], check=True)
          print(f"Verified {len(assets)} deployed assets")
          PY
          echo "FINAL MENA PAGES DEPLOYMENT: SUCCESS"
