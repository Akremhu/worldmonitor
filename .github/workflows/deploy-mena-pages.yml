name: Deploy MENA to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mena-pages
  cancel-in-progress: true

jobs:
  build:
    name: Build MENA
    runs-on: ubuntu-latest
    env:
      VITE_VARIANT: mena
      GITHUB_PAGES: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build MENA
        run: npm run build:mena

      - name: Prepare Pages site
        run: |
          set -euo pipefail
          test -s dist/dashboard.html
          cp dist/dashboard.html dist/index.html
          cp dist/dashboard.html dist/404.html
          touch dist/.nojekyll
          test -s dist/index.html
          test -s dist/404.html
          test -d dist/assets
          find dist/assets -type f | grep -Eq '\\.(js|css)(\\.br)?$'
          grep -q 'MENA Monitor' dist/index.html
          python3 - <<'PY'
          from pathlib import Path
          for name in ('index.html', '404.html'):
              p = Path('dist') / name
              s = p.read_text(encoding='utf-8')
              if '/worldmonitor/assets/' in s:
                  s = s.replace('/worldmonitor/assets/', './assets/')
              p.write_text(s, encoding='utf-8')
              assert './assets/' in s, f'{name}: missing local assets'
          PY

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy MENA
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployed site
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          test -n "$PAGE_URL"
          echo "Verifying $PAGE_URL"
          curl --fail --silent --show-error --location --retry 15 --retry-delay 4 --retry-all-errors "$PAGE_URL" -o /tmp/index.html
          test -s /tmp/index.html
          grep -q 'MENA Monitor' /tmp/index.html
          python3 - <<'PY'
          import re, subprocess, os
          from urllib.parse import urljoin
          page_url = os.environ['PAGE_URL']
          html = open('/tmp/index.html', encoding='utf-8').read()
          refs = re.findall(r'(?:src|href)="([^"]+)"', html)
          assets = sorted({
              urljoin(page_url, ref)
              for ref in refs
              if ref.startswith('./assets/') and re.search(r'\.(?:js|css)(?:\?.*)?$', ref)
          })
          if not assets:
              raise SystemExit('No local JS/CSS assets found')
          for asset in assets:
              print('Checking asset:', asset)
              subprocess.run(['curl','--fail','--silent','--show-error','--location','--retry','8','--retry-delay','2','--retry-all-errors',asset,'-o','/dev/null'], check=True)
          print(f'Verified {len(assets)} deployed JS/CSS assets')
          PY
          echo 'FINAL MENA PAGES DEPLOYMENT: SUCCESS'
