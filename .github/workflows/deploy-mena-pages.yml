name: Deploy MENA to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-mena
  cancel-in-progress: true

jobs:
  build:
    name: Build MENA
    runs-on: ubuntu-latest
    env:
      VITE_VARIANT: mena
      GITHUB_PAGES: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build MENA
        run: npm run build:mena

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare GitHub Pages entrypoint
        run: |
          cp ./dist/dashboard.html ./dist/index.html
          touch ./dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    name: Deploy MENA
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
