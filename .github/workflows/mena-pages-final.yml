name: Deploy MENA Pages Final

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mena-pages-final
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_VARIANT: mena
      GITHUB_PAGES: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build MENA
        run: npm run build:mena
      - name: Validate build output
        run: |
          set -euo pipefail
          test -s dist/dashboard.html
          cp dist/dashboard.html dist/index.html
          cp dist/dashboard.html dist/404.html
          touch dist/.nojekyll
          test -d dist/assets
          find dist/assets -type f | grep -Eq '\\.(js|css)$'
          echo "HTML asset references:"
          grep -Eo '(src|href)="[^"]+\\.(js|css)(\\?[^"]*)?"' dist/index.html | head -20 || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify HTTP response and assets
        env:
          PAGE_URL: https://akremhu.github.io/worldmonitor/
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors "$PAGE_URL" -o /tmp/index.html
          test -s /tmp/index.html
          grep -q 'MENA Monitor' /tmp/index.html
          python3 - <<'PY'
          import re, subprocess, os
          from urllib.parse import urljoin
          page_url = os.environ["PAGE_URL"]
          html = open("/tmp/index.html", encoding="utf-8").read()
          refs = re.findall(r'(?:src|href)="([^"]+\\.(?:js|css)(?:\\?[^"]*)?)"', html)
          assets = sorted(set(urljoin(page_url, u) for u in refs if not u.startswith(("data:", "blob:", "http://", "https://"))))
          if not assets:
              raise SystemExit("No local JS/CSS assets found in deployed HTML")
          for asset in assets:
              subprocess.run(["curl","--fail","--silent","--show-error","--location","--retry","5","--retry-delay","2","--retry-all-errors",asset,"-o","/dev/null"], check=True)
          print(f"Verified {len(assets)} assets")
          PY
          echo "MENA GitHub Pages deployment verified successfully."
